server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # Matches the API's own JSON limit, so oversized bodies stop at the edge.
    client_max_body_size 100k;
    # Slow clients cannot hold connections open indefinitely.
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 30s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's DNS: re-resolve `api` so a recreated container (new IP) keeps working
    # without restarting nginx. A variable in proxy_pass makes nginx honour this.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;

    # The health probe queries the database, so it stays internal: Docker's
    # healthcheck calls the API container directly. A case-insensitive regex with an
    # optional suffix, because Express also routes /api/health/ and /api/HEALTH.
    location ~* ^/api/health(/.*)?$ {
        return 404;
    }

    # Same origin as the SPA, so the browser needs no CORS.
    location /api/ {
        # Only the methods the API uses (GET also allows HEAD).
        limit_except GET POST PATCH {
            deny all;
        }
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (not append) so a client cannot inject a fake address; the API
        # trusts exactly this one hop (TRUST_PROXY_HOPS=1) for per-client rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        # Above the API's worst case: 10s LLM timeout + backoff + one 10s retry.
        proxy_read_timeout 60s;
        # No security headers here: helmet sets them on API responses, and a second
        # CSP would combine with helmet's and break Swagger UI's styles.
    }

    # Content-hashed build output: safe to cache forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback: deep links like /tasks/new are routed by React Router.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
